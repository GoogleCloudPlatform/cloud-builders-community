# In this directory, run the following command to build this builder.
# $ gcloud builds submit . --config=cloudbuild.yaml

substitutions:
  _TERRAFORM_VERSION: 1.13.3
  _TERRAFORM_VERSION_SHA256SUM: 71fc43d92ea09907be5d416d2405a6a9c2d1ceaed633f5e175c0af26e8c4b365
  _TERRAGRUNT_VERSION: 0.87.4
  _TERRAGRUNT_VERSION_SHA256SUM: dd167600fd5e99e02cbb6e7e70ac1f8adbf7ef1c7a32e5afb647656238e1035f

steps:
  - name: "gcr.io/cloud-builders/docker"
    env:
      - "TERRAFORM_VERSION=${_TERRAFORM_VERSION}"
      - "TERRAFORM_VERSION_SHA256SUM=${_TERRAFORM_VERSION_SHA256SUM}"
      - "TERRAGRUNT_VERSION=${_TERRAGRUNT_VERSION}"
      - "TERRAGRUNT_VERSION_SHA256SUM=${_TERRAGRUNT_VERSION_SHA256SUM}"
    args:
      - "build"
      - --build-arg
      - TERRAFORM_VERSION=${_TERRAFORM_VERSION}
      - --build-arg
      - TERRAFORM_VERSION_SHA256SUM=${_TERRAFORM_VERSION_SHA256SUM}
      - --build-arg
      - TERRAGRUNT_VERSION=${_TERRAGRUNT_VERSION}
      - --build-arg
      - TERRAGRUNT_VERSION_SHA256SUM=${_TERRAGRUNT_VERSION_SHA256SUM}
      - --tag
      - "us-central1-docker.pkg.dev/${PROJECT_ID}/devops/terragrunt:${_TERRAFORM_VERSION}-${_TERRAGRUNT_VERSION}"
      - --tag
      - "us-central1-docker.pkg.dev/${PROJECT_ID}/devops/terragrunt:latest"
      - "."
images:
  - "us-central1-docker.pkg.dev/${PROJECT_ID}/devops/terragrunt:${_TERRAFORM_VERSION}-${_TERRAGRUNT_VERSION}"
  - "us-central1-docker.pkg.dev/${PROJECT_ID}/devops/terragrunt:latest"
tags: ["cloud-builders-community"]
